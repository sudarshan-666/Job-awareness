<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Job Awareness Voice Assistant</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 25px;

            background: #101820;

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;
        }


        h1 {

            font-size: 32px;

            margin-bottom: 10px;
        }


        .subtitle {

            font-size: 20px;

            margin-bottom: 25px;
        }


        .status {

            background: #1d2b36;

            border-radius: 15px;

            padding: 20px;

            margin: 20px auto;

            max-width: 700px;

            font-size: 20px;
        }


        .question {

            background: #263746;

            border-radius: 15px;

            padding: 20px;

            margin: 20px auto;

            max-width: 700px;

            font-size: 20px;

            min-height: 60px;
        }


        .answer {

            background: #182c38;

            border-radius: 15px;

            padding: 20px;

            margin: 20px auto;

            max-width: 700px;

            font-size: 20px;

            line-height: 1.6;

            min-height: 80px;
        }


        .start-button {

            font-size: 20px;

            padding: 15px 30px;

            border: none;

            border-radius: 12px;

            background: #1976d2;

            color: white;

            cursor: pointer;
        }


        .start-button:focus {

            outline: 4px solid #ffd54f;
        }


        .hidden {

            display: none;
        }

    </style>

</head>


<body>


    <h1>Job Awareness Voice Assistant</h1>


    <div class="subtitle">

        Voice assistance for visually impaired users

    </div>


    <div class="status" id="status">

        Loading job information...

    </div>


    <div class="question" id="question">

        Waiting for your question...

    </div>


    <div class="answer" id="answer">

        The assistant's answer will appear here.

    </div>


    <button
        id="startButton"
        class="start-button"
        onclick="startAssistant()">

        🎙️ Start Voice Assistant

    </button>



<script>


/* =====================================================
   VARIABLES
===================================================== */


let jobData = [];

let recognition = null;

let assistantRunning = false;

let listening = false;

let isSpeaking = false;


/*
   Stores the complete spoken question.
*/

let finalTranscript = "";

let interimTranscript = "";


/*
   4-second timer.
*/

let replyTimer = null;


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        console.log(
            "Speech synthesis is not supported."
        );

        return;
    }


    /*
       Stop any previous speech.
    */

    window.speechSynthesis.cancel();


    isSpeaking = true;


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang = "en-IN";

    speech.rate = 0.9;

    speech.pitch = 1;

    speech.volume = 1;


    speech.onstart = function() {

        isSpeaking = true;

    };


    speech.onend = function() {

        isSpeaking = false;


        /*
           After answering, automatically
           start listening for the next question.
        */

        if (assistantRunning) {

            document.getElementById("status").innerText =
                "Ready. Please speak your next question.";


            setTimeout(function() {

                startListening();

            }, 500);

        }

    };


    window.speechSynthesis.speak(speech);

}


/* =====================================================
   LOAD DATASET
===================================================== */

async function loadDataset() {

    try {

        const response =
            await fetch("jobs.json");


        if (!response.ok) {

            throw new Error(
                "Could not load jobs.json"
            );

        }


        const data =
            await response.json();


        /*
           Your existing dataset uses:

           {
               "jobs": [...]
           }

           Therefore we keep:

           data.jobs
        */

        jobData =
            data.jobs || [];


        document.getElementById("status").innerText =
            "Job information loaded successfully.";


        console.log(
            "Dataset loaded:",
            jobData
        );


        return true;

    }

    catch (error) {

        console.error(error);


        document.getElementById("status").innerText =
            "Unable to load the job database.";


        speak(
            "Sorry. I could not load the job information database."
        );


        return false;
    }

}


/* =====================================================
   FIND JOB
===================================================== */

function findJob(question) {

    const q =
        question.toLowerCase();


    let bestJob = null;

    let bestScore = 0;


    for (const job of jobData) {


        let score = 0;


        /*
           JOB TITLE
        */

        if (job.title) {

            const titleWords =
                job.title
                    .toLowerCase()
                    .split(" ");


            for (const word of titleWords) {

                if (
                    word.length > 2 &&
                    q.includes(word)
                ) {

                    score += 5;

                }

            }

        }


        /*
           CATEGORY
        */

        if (job.category) {

            const categoryWords =
                job.category
                    .toLowerCase()
                    .split(" ");


            for (const word of categoryWords) {

                if (
                    word.length > 2 &&
                    q.includes(word)
                ) {

                    score += 3;

                }

            }

        }


        /*
           SKILLS
        */

        if (Array.isArray(job.skills)) {

            for (const skill of job.skills) {

                if (
                    q.includes(
                        skill.toLowerCase()
                    )
                ) {

                    score += 2;

                }

            }

        }


        if (score > bestScore) {

            bestScore = score;

            bestJob = job;

        }

    }


    return bestJob;

}


/* =====================================================
   FIND INTENT
===================================================== */

function findIntent(question) {

    const q =
        question.toLowerCase();


    /*
       SALARY
    */

    if (

        q.includes("salary") ||

        q.includes("pay") ||

        q.includes("package") ||

        q.includes("earn") ||

        q.includes("income")

    ) {

        return "salary";

    }


    /*
       QUALIFICATION
    */

    if (

        q.includes("qualification") ||

        q.includes("degree") ||

        q.includes("education") ||

        q.includes("eligible") ||

        q.includes("eligibility")

    ) {

        return "qualification";

    }


    /*
       SKILLS
    */

    if (

        q.includes("skill") ||

        q.includes("skills") ||

        q.includes("learn") ||

        q.includes("technology")

    ) {

        return "skills";

    }


    /*
       EXPERIENCE
    */

    if (

        q.includes("experience") ||

        q.includes("fresher")

    ) {

        return "experience";

    }


    /*
       AGE
    */

    if (

        q.includes("age") ||

        q.includes("years old")

    ) {

        return "age";

    }


    /*
       LOCATION
    */

    if (

        q.includes("location") ||

        q.includes("where") ||

        q.includes("city")

    ) {

        return "location";

    }


    /*
       DESCRIPTION
    */

    if (

        q.includes("what does") ||

        q.includes("what is") ||

        q.includes("about") ||

        q.includes("description")

    ) {

        return "description";

    }


    /*
       JOBS
    */

    if (

        q.includes("job") ||

        q.includes("jobs") ||

        q.includes("career") ||

        q.includes("work")

    ) {

        return "jobs";

    }


    return "general";

}


/* =====================================================
   ANSWER QUESTION
===================================================== */

function answerQuestion(question) {

    const q =
        question.toLowerCase();


    const intent =
        findIntent(question);


    const job =
        findJob(question);


    /* =================================================
       JOB LIST
    ================================================= */

    if (

        intent === "jobs" &&

        !job

    ) {


        if (jobData.length === 0) {

            return
                "There are currently no jobs available in the dataset.";

        }


        const names =
            jobData
                .map(j => j.title)
                .join(", ");


        return (

            "The jobs currently available in my database are: "

            + names +

            ". You can ask me about the qualification, skills, salary, experience or location of any of these jobs."

        );

    }


    /* =================================================
       SPECIFIC JOB
    ================================================= */

    if (job) {


        /* ---------------------------------------------
           QUALIFICATION
        --------------------------------------------- */

        if (intent === "qualification") {

            return (

                job.title +

                " requires " +

                job.qualification +

                "."

            );

        }


        /* ---------------------------------------------
           SKILLS
        --------------------------------------------- */

        if (intent === "skills") {

            return (

                "For " +

                job.title +

                ", useful skills include " +

                job.skills.join(", ") +

                "."

            );

        }


        /* ---------------------------------------------
           SALARY
        --------------------------------------------- */

        if (intent === "salary") {

            return (

                "The expected salary range for " +

                job.title +

                " is " +

                job.salary +

                "."

            );

        }


        /* ---------------------------------------------
           EXPERIENCE
        --------------------------------------------- */

        if (intent === "experience") {

            return (

                "For " +

                job.title +

                ", " +

                job.experience +

                "."

            );

        }


        /* ---------------------------------------------
           AGE
        --------------------------------------------- */

        if (intent === "age") {

            return (

                "The age information for " +

                job.title +

                " is: " +

                job.age +

                "."

            );

        }


        /* ---------------------------------------------
           LOCATION
        --------------------------------------------- */

        if (intent === "location") {

            return (

                "You can find " +

                job.title +

                " opportunities in " +

                job.location +

                "."

            );

        }


        /* ---------------------------------------------
           DESCRIPTION
        --------------------------------------------- */

        if (intent === "description") {

            return (

                job.title +

                " is a " +

                job.category +

                " career. " +

                job.description

            );

        }


        /*
           DEFAULT SPECIFIC JOB ANSWER
        */

        return (

            job.title +

            " is a " +

            job.category +

            " job. " +

            job.description +

            " You can ask me about its qualifications, skills, salary, experience or location."

        );

    }


    /* =================================================
       GENERAL QUESTIONS
    ================================================= */


    if (intent === "qualification") {

        return (

            "I can tell you the qualifications required for different jobs. Please mention the job you are interested in."

        );

    }


    if (intent === "skills") {

        return (

            "I can provide the skills required for different jobs. Please tell me the job you are interested in."

        );

    }


    if (intent === "salary") {

        return (

            "I can provide salary information for different jobs. Please tell me the job title."

        );

    }


    if (intent === "experience") {

        return (

            "I can tell you whether a job is suitable for freshers and what experience is useful. Please tell me the job title."

        );

    }


    if (intent === "location") {

        return (

            "I can tell you where different jobs are available. Please mention the job you are interested in."

        );

    }


    /* =================================================
       GREETING
    ================================================= */

    if (

        q.includes("hello") ||

        q.includes("hi") ||

        q.includes("hey")

    ) {

        return (

            "Hello. I am your job awareness voice assistant. You can ask me about jobs, qualifications, skills, salary, experience, age requirements or job locations."

        );

    }


    /* =================================================
       HELP
    ================================================= */

    if (

        q.includes("help") ||

        q.includes("what can you do")

    ) {

        return (

            "I can provide job awareness information from my database. You can ask me about available jobs, qualifications, skills, salary, experience, age requirements or job locations."

        );

    }


    /* =================================================
       DEFAULT
    ================================================= */

    return (

        "I could not find a specific answer to that question. You can ask me about available jobs, qualifications, skills, salary, experience, age requirements or locations."

    );

}


/* =====================================================
   PROCESS QUESTION
===================================================== */

function processQuestion(question) {

    if (
        !question ||
        question.trim() === ""
    ) {

        return;

    }


    /*
       Display question.
    */

    document.getElementById("question").innerText =

        "You asked: " +

        question;


    /*
       Show processing message.
    */

    document.getElementById("status").innerText =

        "Preparing your answer...";


    /*
       Generate answer.
    */

    const answer =
        answerQuestion(question);


    /*
       Display answer.
    */

    document.getElementById("answer").innerText =
        answer;


    /*
       Speak answer.
    */

    speak(answer);

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

function setupRecognition() {


    const SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        document.getElementById("status").innerText =

            "Voice recognition is not supported in this browser.";


        speak(

            "Voice recognition is not supported in this browser. Please use Google Chrome."

        );


        return false;

    }


    recognition =
        new SpeechRecognition();


    /*
       IMPORTANT:

       continuous = true

       This allows the user to continue speaking.
    */

    recognition.continuous = true;


    recognition.interimResults = true;


    recognition.lang = "en-IN";


    /* =================================================
       WHEN LISTENING STARTS
    ================================================= */

    recognition.onstart = function() {

        listening = true;


        document.getElementById("status").innerText =

            "🎙️ Listening... Speak continuously.";

    };


    /* =================================================
       SPEECH RESULT
    ================================================= */

    recognition.onresult = function(event) {


        /*
           Process all newly received speech.
        */

        for (

            let i = event.resultIndex;

            i < event.results.length;

            i++

        ) {


            const transcript =

                event.results[i][0].transcript;


            if (
                event.results[i].isFinal
            ) {

                /*
                   Add final speech to complete question.
                */

                finalTranscript +=
                    transcript + " ";

                interimTranscript = "";

            }
            else {

                /*
                   Temporary speech.
                */

                interimTranscript +=
                    transcript;

            }

        }


        /*
           Complete current question.
        */

        const currentQuestion =

            (

                finalTranscript +

                interimTranscript

            ).trim();


        if (currentQuestion) {

            document.getElementById("question").innerText =

                "You are saying: " +

                currentQuestion;


            document.getElementById("status").innerText =

                "🎙️ Listening...";


        }


        /*
           IMPORTANT:

           Every time new speech arrives,
           restart the 4-second timer.

           Therefore the assistant waits until
           4 seconds AFTER the user stops speaking.
        */

        clearTimeout(replyTimer);


        replyTimer = setTimeout(

            function() {

                const completeQuestion =

                    (

                        finalTranscript +

                        interimTranscript

                    ).trim();


                if (
                    completeQuestion.length === 0
                ) {

                    return;

                }


                /*
                   Stop microphone temporarily.
                */

                try {

                    recognition.stop();

                }

                catch (error) {

                    console.log(error);

                }


                listening = false;


                /*
                   Clear the transcript variables
                   BEFORE answering.
                */

                finalTranscript = "";

                interimTranscript = "";


                /*
                   Give the answer.
                */

                processQuestion(
                    completeQuestion
                );

            },

            4000

        );

    };


    /* =================================================
       RECOGNITION ERROR
    ================================================= */

    recognition.onerror = function(event) {


        console.log(

            "Speech recognition error:",

            event.error

        );


        listening = false;


        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            assistantRunning = false;


            document.getElementById("status").innerText =

                "Microphone permission is required.";

            return;

        }


        /*
           Automatically try listening again.
        */

        if (assistantRunning) {

            setTimeout(

                function() {

                    startListening();

                },

                1000

            );

        }

    };


    /* =================================================
       RECOGNITION ENDS
    ================================================= */

    recognition.onend = function() {


        listening = false;


        /*
           If the assistant is running and it is
           NOT currently speaking, restart listening.

           This helps browsers that automatically
           stop speech recognition.
        */

        if (

            assistantRunning &&

            !isSpeaking

        ) {

            setTimeout(

                function() {

                    startListening();

                },

                500

            );

        }

    };


    return true;

}


/* =====================================================
   START LISTENING
===================================================== */

function startListening() {


    if (
        !assistantRunning ||
        !recognition ||
        listening ||
        isSpeaking
    ) {

        return;

    }


    try {

        recognition.start();

    }

    catch (error) {

        console.log(

            "Recognition already running:",

            error

        );

    }

}


/* =====================================================
   START ASSISTANT
===================================================== */

async function startAssistant() {


    /*
       Prevent multiple starts.
    */

    if (assistantRunning) {

        return;

    }


    assistantRunning = true;


    /*
       Hide start button.
    */

    document
        .getElementById("startButton")
        .classList.add("hidden");


    /*
       Load dataset.
    */

    const loaded =
        await loadDataset();


    if (!loaded) {

        assistantRunning = false;

        return;

    }


    /*
       Setup microphone.
    */

    const recognitionReady =
        setupRecognition();


    if (!recognitionReady) {

        assistantRunning = false;

        return;

    }


    /*
       Welcome message.
    */

    const welcome =

        "Welcome to the Job Awareness Voice Assistant. " +

        "I can help you find information about jobs, qualifications, skills, salary, experience, age requirements and locations. " +

        "Please speak your question.";


    document.getElementById("answer").innerText =
        welcome;


    /*
       Speak welcome.
    */

    speak(welcome);

}


/* =====================================================
   INITIAL PAGE
===================================================== */

window.addEventListener(

    "load",

    function() {

        document.getElementById("status").innerText =

            "Ready. Press Start Voice Assistant.";

    }

);

</script>

</body>

</html>
