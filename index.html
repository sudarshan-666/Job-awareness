<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Job Awareness Voice Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .status {
            background: #1d2b36;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 750px;
            font-size: 20px;
        }

        .question {
            background: #263746;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 750px;
            font-size: 20px;
            min-height: 60px;
        }

        .answer {
            background: #182c38;
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 750px;
            font-size: 20px;
            line-height: 1.6;
            min-height: 80px;
            text-align: left;
        }

        .start-button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        .start-button:focus {
            outline: 4px solid #ffd54f;
        }

        .hidden {
            display: none;
        }
    </style>
</head>


<body>

    <h1>Job Awareness Voice Assistant</h1>

    <div class="subtitle">
        Voice assistance for visually impaired users
    </div>

    <div class="status" id="status">
        Ready. Press Start Voice Assistant.
    </div>

    <div class="question" id="question">
        Waiting for your question...
    </div>

    <div class="answer" id="answer">
        The assistant's answer will appear here.
    </div>

    <button
        id="startButton"
        class="start-button"
        onclick="startAssistant()">

        🎙️ Start Voice Assistant

    </button>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let jobData = [];

let recognition = null;

let assistantRunning = false;

let listening = false;

let speaking = false;

let replyTimer = null;

let finalText = "";

let temporaryText = "";


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    speaking = true;

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";

    speech.rate = 0.9;

    speech.pitch = 1;

    speech.volume = 1;


    speech.onend = function () {

        speaking = false;

        if (assistantRunning) {

            document.getElementById("status").innerText =
                "Ready. Please speak your next question.";

            setTimeout(function () {

                startListening();

            }, 500);
        }
    };


    window.speechSynthesis.speak(speech);
}


/* =========================================================
   LOAD JSON DATASET
========================================================= */

async function loadDataset() {

    try {

        const response =
            await fetch("jobs.json");


        if (!response.ok) {

            throw new Error(
                "jobs.json not found"
            );

        }


        const data =
            await response.json();


        /*
           Your existing JSON structure is:

           {
               "jobs": [
                   ...
               ]
           }

           So this is checked first.
        */

        if (Array.isArray(data.jobs)) {

            jobData = data.jobs;

        }

        /*
           Also support a direct array.
        */

        else if (Array.isArray(data)) {

            jobData = data;

        }

        else {

            jobData = [];

        }


        console.log(
            "Loaded jobs:",
            jobData
        );


        document.getElementById("status").innerText =

            "Job information loaded successfully. Press Start.";


        return true;

    }

    catch (error) {

        console.error(error);


        document.getElementById("status").innerText =

            "Unable to load jobs.json.";


        return false;
    }
}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return String(text || "")
        .toLowerCase()
        .replace(/[.,!?;:()\-_/]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   GET FIELD
========================================================= */

function getField(job, names) {

    for (const name of names) {

        if (
            job[name] !== undefined &&
            job[name] !== null
        ) {

            return job[name];

        }
    }

    return "";
}


/* =========================================================
   CONVERT VALUE TO TEXT
========================================================= */

function valueToText(value) {

    if (Array.isArray(value)) {

        return value.join(", ");

    }

    if (
        typeof value === "object" &&
        value !== null
    ) {

        return Object.values(value).join(", ");

    }

    return String(value || "");

}


/* =========================================================
   GET JOB QUALIFICATION
========================================================= */

function getQualification(job) {

    return valueToText(
        getField(job, [
            "qualification",
            "qualifications",
            "education",
            "eligibility",
            "degree"
        ])
    );
}


/* =========================================================
   GET JOB TYPE
========================================================= */

function getJobType(job) {

    return valueToText(
        getField(job, [
            "jobType",
            "job_type",
            "type",
            "employmentType",
            "employment_type"
        ])
    );
}


/* =========================================================
   GET WORKING HOURS
========================================================= */

function getWorkingHours(job) {

    return valueToText(
        getField(job, [
            "workingHours",
            "working_hours",
            "timing",
            "timings",
            "workHours",
            "work_hours"
        ])
    );
}


/* =========================================================
   GET SKILLS
========================================================= */

function getSkills(job) {

    return valueToText(
        getField(job, [
            "skills",
            "skill",
            "requiredSkills",
            "required_skills"
        ])
    );
}


/* =========================================================
   GET SALARY
========================================================= */

function getSalary(job) {

    return valueToText(
        getField(job, [
            "salary",
            "salaryRange",
            "salary_range",
            "pay"
        ])
    );
}


/* =========================================================
   GET EXPERIENCE
========================================================= */

function getExperience(job) {

    return valueToText(
        getField(job, [
            "experience",
            "experienceRequired",
            "experience_required"
        ])
    );
}


/* =========================================================
   GET AGE
========================================================= */

function getAge(job) {

    return valueToText(
        getField(job, [
            "age",
            "ageRequirement",
            "age_requirement"
        ])
    );
}


/* =========================================================
   GET LOCATION
========================================================= */

function getLocation(job) {

    return valueToText(
        getField(job, [
            "location",
            "locations",
            "city",
            "place"
        ])
    );
}


/* =========================================================
   GET TITLE
========================================================= */

function getTitle(job) {

    return valueToText(
        getField(job, [
            "title",
            "jobTitle",
            "job_title",
            "name"
        ])
    );
}


/* =========================================================
   GET CATEGORY
========================================================= */

function getCategory(job) {

    return valueToText(
        getField(job, [
            "category",
            "field",
            "domain",
            "sector"
        ])
    );
}


/* =========================================================
   GET DESCRIPTION
========================================================= */

function getDescription(job) {

    return valueToText(
        getField(job, [
            "description",
            "details",
            "about"
        ])
    );
}


/* =========================================================
   QUALIFICATION MATCHING
========================================================= */

function qualificationMatches(jobQualification, question) {

    const q = normalize(question);

    const jq = normalize(jobQualification);


    /*
       BELOW 8TH
    */

    if (
        q.includes("below 8th") ||
        q.includes("below eighth") ||
        q.includes("below 8") ||
        q.includes("under 8th") ||
        q.includes("under eighth")
    ) {

        return (
            jq.includes("below 8") ||
            jq.includes("below eighth") ||
            jq.includes("below 8th")
        );

    }


    /*
       8TH STANDARD
    */

    if (
        q.includes("8th standard") ||
        q.includes("8th std") ||
        q.includes("eighth standard") ||
        q.includes("eighth std") ||
        q.includes("8 standard")
    ) {

        return (
            jq.includes("8th") ||
            jq.includes("eighth")
        );

    }


    /*
       10TH STANDARD
    */

    if (
        q.includes("10th standard") ||
        q.includes("10th std") ||
        q.includes("tenth standard") ||
        q.includes("tenth std") ||
        q.includes("10 standard") ||
        q.includes("sslc")
    ) {

        return (
            jq.includes("10th") ||
            jq.includes("tenth") ||
            jq.includes("sslc")
        );

    }


    /*
       12TH STANDARD
    */

    if (
        q.includes("12th standard") ||
        q.includes("12th std") ||
        q.includes("twelfth standard") ||
        q.includes("twelfth std") ||
        q.includes("12 standard") ||
        q.includes("plus two") ||
        q.includes("hsc")
    ) {

        return (
            jq.includes("12th") ||
            jq.includes("twelfth") ||
            jq.includes("plus two") ||
            jq.includes("hsc")
        );

    }


    /*
       COMMON QUALIFICATIONS

       Remove spaces so B.Com and B Com
       can both match.
    */

    const cleanQ =
        q.replace(/[\s.]/g, "");

    const cleanJQ =
        jq.replace(/[\s.]/g, "");


    const qualificationCodes = [

        "iti",

        "diploma",

        "ba",

        "bcom",

        "bba",

        "bca",

        "bsc",

        "btech",

        "be",

        "ma",

        "mcom",

        "mba",

        "mca",

        "msc",

        "mtech",

        "me"

    ];


    for (const code of qualificationCodes) {

        if (cleanQ.includes(code)) {

            if (cleanJQ.includes(code)) {

                return true;

            }

        }

    }


    /*
       Full qualification names.
    */

    const fullNames = [

        "bachelor of arts",

        "bachelor of commerce",

        "bachelor of business administration",

        "bachelor of computer applications",

        "bachelor of science",

        "bachelor of technology",

        "bachelor of engineering",

        "master of arts",

        "master of commerce",

        "master of business administration",

        "master of computer applications",

        "master of science",

        "master of technology",

        "master of engineering",

        "industrial training institute",

        "diploma"

    ];


    for (const name of fullNames) {

        if (q.includes(name)) {

            if (jq.includes(name)) {

                return true;

            }

        }

    }


    return false;
}


/* =========================================================
   DETECT QUALIFICATION IN QUESTION
========================================================= */

function questionHasQualification(question) {

    const q =
        normalize(question);


    const patterns = [

        "below 8th",
        "below eighth",
        "8th standard",
        "8th std",
        "eighth standard",

        "10th standard",
        "10th std",
        "tenth standard",

        "12th standard",
        "12th std",
        "twelfth standard",
        "plus two",

        "iti",
        "diploma",

        "b.a",
        "ba",

        "b.com",
        "bcom",

        "bba",

        "bca",

        "b.sc",
        "bsc",

        "b.e",
        "be",

        "b.tech",
        "btech",

        "m.a",
        "ma",

        "m.com",
        "mcom",

        "mba",

        "mca",

        "m.sc",
        "msc",

        "m.e",
        "me",

        "m.tech",
        "mtech",

        "bachelor of arts",
        "bachelor of commerce",
        "bachelor of business administration",
        "bachelor of computer applications",
        "bachelor of science",
        "bachelor of technology",

        "master of arts",
        "master of commerce",
        "master of business administration",
        "master of computer applications",
        "master of science",
        "master of technology"

    ];


    return patterns.some(
        pattern => q.includes(pattern)
    );
}


/* =========================================================
   DETECT JOB TYPE IN QUESTION
========================================================= */

function questionJobType(question) {

    const q =
        normalize(question);


    if (
        q.includes("part time") ||
        q.includes("parttime")
    ) {

        return "part";

    }


    if (
        q.includes("full time") ||
        q.includes("fulltime")
    ) {

        return "full";

    }


    return "";
}


/* =========================================================
   JOB TYPE MATCH
========================================================= */

function jobTypeMatches(job, requiredType) {

    if (!requiredType) {

        return true;

    }


    const type =
        normalize(getJobType(job));


    if (requiredType === "part") {

        return (
            type.includes("part")
        );

    }


    if (requiredType === "full") {

        return (
            type.includes("full")
        );

    }


    return true;
}


/* =========================================================
   FIND JOBS BY QUALIFICATION
========================================================= */

function findJobsByQualification(question) {

    const requiredType =
        questionJobType(question);


    let results =
        jobData.filter(function(job) {

            return qualificationMatches(
                getQualification(job),
                question
            );

        });


    if (requiredType) {

        results =
            results.filter(function(job) {

                return jobTypeMatches(
                    job,
                    requiredType
                );

            });

    }


    return results;
}


/* =========================================================
   FIND SPECIFIC JOB
========================================================= */

function findSpecificJob(question) {

    const q =
        normalize(question);


    let bestJob = null;

    let bestScore = 0;


    for (const job of jobData) {

        let score = 0;


        const title =
            normalize(getTitle(job));


        const category =
            normalize(getCategory(job));


        const skills =
            normalize(getSkills(job));


        if (
            title &&
            q.includes(title)
        ) {

            score += 20;

        }


        const titleWords =
            title.split(" ");


        for (const word of titleWords) {

            if (
                word.length > 2 &&
                q.includes(word)
            ) {

                score += 5;

            }

        }


        const categoryWords =
            category.split(" ");


        for (const word of categoryWords) {

            if (
                word.length > 2 &&
                q.includes(word)
            ) {

                score += 3;

            }

        }


        const skillWords =
            skills.split(",");


        for (const skill of skillWords) {

            const cleanSkill =
                normalize(skill);


            if (
                cleanSkill.length > 2 &&
                q.includes(cleanSkill)
            ) {

                score += 2;

            }

        }


        if (score > bestScore) {

            bestScore = score;

            bestJob = job;

        }

    }


    return bestJob;
}


/* =========================================================
   FIND INTENT
========================================================= */

function findIntent(question) {

    const q =
        normalize(question);


    if (
        q.includes("salary") ||
        q.includes("pay") ||
        q.includes("package") ||
        q.includes("earn") ||
        q.includes("income")
    ) {

        return "salary";

    }


    if (
        q.includes("qualification") ||
        q.includes("degree") ||
        q.includes("education") ||
        q.includes("eligible") ||
        q.includes("eligibility")
    ) {

        return "qualification";

    }


    if (
        q.includes("skill") ||
        q.includes("skills") ||
        q.includes("learn") ||
        q.includes("technology")
    ) {

        return "skills";

    }


    if (
        q.includes("experience") ||
        q.includes("fresher")
    ) {

        return "experience";

    }


    if (
        q.includes("working hours") ||
        q.includes("work hours") ||
        q.includes("working time") ||
        q.includes("timing") ||
        q.includes("timings")
    ) {

        return "timing";

    }


    if (
        q.includes("part time") ||
        q.includes("parttime") ||
        q.includes("full time") ||
        q.includes("fulltime")
    ) {

        return "jobs";

    }


    if (
        q.includes("age") ||
        q.includes("years old")
    ) {

        return "age";

    }


    if (
        q.includes("location") ||
        q.includes("where") ||
        q.includes("city")
    ) {

        return "location";

    }


    if (
        q.includes("what does") ||
        q.includes("what is") ||
        q.includes("about") ||
        q.includes("description")
    ) {

        return "description";

    }


    if (
        q.includes("job") ||
        q.includes("jobs") ||
        q.includes("career") ||
        q.includes("work")
    ) {

        return "jobs";

    }


    return "general";
}


/* =========================================================
   FORMAT JOB INFORMATION
========================================================= */

function formatJob(job) {

    const title =
        getTitle(job);

    const qualification =
        getQualification(job);

    const type =
        getJobType(job);

    const salary =
        getSalary(job);

    const hours =
        getWorkingHours(job);

    const skills =
        getSkills(job);

    const experience =
        getExperience(job);

    const location =
        getLocation(job);


    let text =
        title + ".";


    if (qualification) {

        text +=
            " Qualification: " +
            qualification +
            ".";

    }


    if (type) {

        text +=
            " Job type: " +
            type +
            ".";

    }


    if (salary) {

        text +=
            " Salary: " +
            salary +
            ".";

    }


    if (hours) {

        text +=
            " Working hours: " +
            hours +
            ".";

    }


    if (skills) {

        text +=
            " Skills: " +
            skills +
            ".";

    }


    if (experience) {

        text +=
            " Experience: " +
            experience +
            ".";

    }


    if (location) {

        text +=
            " Location: " +
            location +
            ".";

    }


    return text;
}


/* =========================================================
   ANSWER QUESTION
========================================================= */

function answerQuestion(question) {

    const q =
        normalize(question);


    const intent =
        findIntent(question);


    /*
       GREETING
    */

    if (
        q === "hi" ||
        q === "hello" ||
        q.includes("hello assistant") ||
        q.includes("hi assistant")
    ) {

        return (
            "Hello. I am your job awareness voice assistant. " +
            "You can ask me about jobs, qualifications, salary, skills, experience, working hours, job type or location."
        );

    }


    /*
       HELP
    */

    if (
        q.includes("help") ||
        q.includes("what can you do")
    ) {

        return (
            "I can provide job information from the job database. " +
            "You can ask questions such as: What jobs can I get after 10th standard? " +
            "What jobs are available after B.Com? " +
            "What part-time jobs are available? " +
            "What is the salary and working time?"
        );

    }


    /*
       -----------------------------------------------------
       QUALIFICATION + JOB TYPE
       -----------------------------------------------------
    */

    if (
        questionHasQualification(question)
    ) {


        const qualificationJobs =
            findJobsByQualification(question);


        if (
            qualificationJobs.length === 0
        ) {

            return (
                "I could not find a matching job for that qualification in the current database."
            );

        }


        let prefix =
            "I found " +
            qualificationJobs.length +
            " matching job";


        if (
            qualificationJobs.length !== 1
        ) {

            prefix += "s";

        }


        prefix += ".";


        let response =
            prefix + " ";


        qualificationJobs
            .slice(0, 10)
            .forEach(function(job) {

                response +=
                    formatJob(job) +
                    " ";

            });


        return response;
    }


    /*
       -----------------------------------------------------
       SPECIFIC JOB
       -----------------------------------------------------
    */

    const job =
        findSpecificJob(question);


    if (job) {


        /*
           SALARY
        */

        if (intent === "salary") {

            const salary =
                getSalary(job);


            return (
                "The salary for " +
                getTitle(job) +
                " is " +
                (salary || "not specified in the dataset") +
                "."
            );

        }


        /*
           QUALIFICATION
        */

        if (intent === "qualification") {

            return (
                getTitle(job) +
                " requires " +
                (getQualification(job) ||
                 "a qualification not specified in the dataset") +
                "."
            );

        }


        /*
           SKILLS
        */

        if (intent === "skills") {

            return (
                "The skills required for " +
                getTitle(job) +
                " are " +
                (getSkills(job) ||
                 "not specified in the dataset") +
                "."
            );

        }


        /*
           EXPERIENCE
        */

        if (intent === "experience") {

            return (
                "For " +
                getTitle(job) +
                ", the experience requirement is " +
                (getExperience(job) ||
                 "not specified in the dataset") +
                "."
            );

        }


        /*
           WORKING HOURS
        */

        if (intent === "timing") {

            return (
                "The working hours for " +
                getTitle(job) +
                " are " +
                (getWorkingHours(job) ||
                 "not specified in the dataset") +
                "."
            );

        }


        /*
           LOCATION
        */

        if (intent === "location") {

            return (
                getTitle(job) +
                " opportunities are available in " +
                (getLocation(job) ||
                 "a location not specified in the dataset") +
                "."
            );

        }


        /*
           AGE
        */

        if (intent === "age") {

            return (
                "The age requirement for " +
                getTitle(job) +
                " is " +
                (getAge(job) ||
                 "not specified in the dataset") +
                "."
            );

        }


        /*
           DESCRIPTION
        */

        if (intent === "description") {

            return (
                getTitle(job) +
                " is a " +
                getCategory(job) +
                " career. " +
                getDescription(job)
            );

        }


        /*
           DEFAULT JOB ANSWER
        */

        return formatJob(job);
    }


    /*
       -----------------------------------------------------
       JOB LIST
       -----------------------------------------------------
    */

    if (intent === "jobs") {

        if (jobData.length === 0) {

            return (
                "There are currently no jobs in the database."
            );

        }


        const requiredType =
            questionJobType(question);


        let jobs =
            jobData;


        if (requiredType) {

            jobs =
                jobs.filter(function(job) {

                    return jobTypeMatches(
                        job,
                        requiredType
                    );

                });

        }


        if (jobs.length === 0) {

            return (
                "I could not find jobs matching that job type in the database."
            );

        }


        let response =
            "I found " +
            jobs.length +
            " jobs";


        if (requiredType === "part") {

            response +=
                " for part-time work.";

        }

        else if (requiredType === "full") {

            response +=
                " for full-time work.";

        }

        else {

            response += ".";

        }


        response += " ";


        jobs.slice(0, 10)
            .forEach(function(job) {

                response +=
                    formatJob(job) +
                    " ";

            });


        return response;
    }


    /*
       -----------------------------------------------------
       GENERAL INTENT
       -----------------------------------------------------
    */

    if (intent === "salary") {

        return (
            "Please tell me the job title or your qualification so I can provide the salary information."
        );

    }


    if (intent === "qualification") {

        return (
            "Please tell me the job title. I can tell you the qualification required for that job."
        );

    }


    if (intent === "skills") {

        return (
            "Please tell me the job title or your qualification so I can provide the required skills."
        );

    }


    if (intent === "experience") {

        return (
            "Please tell me the job title or your qualification so I can provide the experience information."
        );

    }


    if (intent === "timing") {

        return (
            "Please tell me the job title or your qualification so I can provide the working hours."
        );

    }


    /*
       DEFAULT
    */

    return (
        "I could not find a specific answer. " +
        "Please ask me about a qualification, job, salary, skills, experience, working hours, job type or location."
    );
}


/* =========================================================
   PROCESS QUESTION
========================================================= */

function processQuestion(question) {

    if (
        !question ||
        question.trim() === ""
    ) {

        return;

    }


    document.getElementById("question").innerText =
        "You asked: " + question;


    document.getElementById("status").innerText =
        "Preparing your answer...";


    const answer =
        answerQuestion(question);


    document.getElementById("answer").innerText =
        answer;


    speak(answer);
}


/* =========================================================
   SETUP SPEECH RECOGNITION
========================================================= */

function setupRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        document.getElementById("status").innerText =
            "Voice recognition is not supported. Please use Google Chrome.";

        return false;
    }


    recognition =
        new SpeechRecognition();


    /*
       Continuous speech.
    */

    recognition.continuous =
        true;


    /*
       Show temporary speech too.
    */

    recognition.interimResults =
        true;


    recognition.lang =
        "en-IN";


    /* =====================================================
       START
    ===================================================== */

    recognition.onstart =
        function() {

            listening = true;


            document.getElementById("status").innerText =
                "🎙️ Listening... Speak continuously.";

        };


    /* =====================================================
       RESULT
    ===================================================== */

    recognition.onresult =
        function(event) {


            temporaryText = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {


                const transcript =
                    event.results[i][0].transcript;


                if (
                    event.results[i].isFinal
                ) {

                    finalText +=
                        transcript + " ";

                }

                else {

                    temporaryText +=
                        transcript;

                }

            }


            const currentText =

                (
                    finalText +
                    temporaryText
                ).trim();


            if (currentText) {

                document.getElementById("question").innerText =
                    "You are saying: " + currentText;

            }


            /*
               ------------------------------------------------
               RESET THE TIMER EVERY TIME SPEECH IS RECEIVED
               ------------------------------------------------

               This means the assistant waits for 4 seconds
               AFTER the user stops speaking.
            */

            clearTimeout(replyTimer);


            replyTimer =
                setTimeout(function() {


                    const completeQuestion =

                        (
                            finalText +
                            temporaryText
                        ).trim();


                    if (!completeQuestion) {

                        return;

                    }


                    /*
                       Stop listening temporarily.
                    */

                    try {

                        recognition.stop();

                    }

                    catch (error) {

                        console.log(error);

                    }


                    listening =
                        false;


                    /*
                       Save question before clearing variables.
                    */

                    const questionToProcess =
                        completeQuestion;


                    finalText =
                        "";

                    temporaryText =
                        "";


                    /*
                       Answer.
                    */

                    processQuestion(
                        questionToProcess
                    );


                }, 4000);

        };


    /* =====================================================
       ERROR
    ===================================================== */

    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );


            listening =
                false;


            if (
                event.error === "not-allowed" ||
                event.error === "service-not-allowed"
            ) {

                assistantRunning =
                    false;


                document.getElementById("status").innerText =
                    "Please allow microphone permission.";

                return;

            }


            if (assistantRunning) {

                setTimeout(function() {

                    startListening();

                }, 1000);

            }

        };


    /* =====================================================
       END
    ===================================================== */

    recognition.onend =
        function() {

            listening =
                false;


            /*
               If browser stops recognition automatically,
               restart it.
            */

            if (
                assistantRunning &&
                !speaking
            ) {

                setTimeout(function() {

                    startListening();

                }, 500);

            }

        };


    return true;
}


/* =========================================================
   START LISTENING
========================================================= */

function startListening() {

    if (
        !assistantRunning ||
        !recognition ||
        listening ||
        speaking
    ) {

        return;

    }


    try {

        recognition.start();

    }

    catch (error) {

        console.log(
            "Recognition start error:",
            error
        );

    }
}


/* =========================================================
   START ASSISTANT
========================================================= */

async function startAssistant() {


    if (assistantRunning) {

        return;

    }


    assistantRunning =
        true;


    document
        .getElementById("startButton")
        .classList.add("hidden");


    /*
       Load jobs.json.
    */

    const loaded =
        await loadDataset();


    if (!loaded) {

        assistantRunning =
            false;

        return;

    }


    /*
       Setup microphone.
    */

    const ready =
        setupRecognition();


    if (!ready) {

        assistantRunning =
            false;

        return;

    }


    /*
       Welcome message.
    */

    const welcome =

        "Welcome to the Job Awareness Voice Assistant. " +
        "You can ask me about jobs, qualifications, salary, skills, experience, working hours, job type or location. " +
        "Please speak your question.";


    document.getElementById("answer").innerText =
        welcome;


    document.getElementById("status").innerText =
        "Welcome message. Please wait...";


    speak(welcome);

}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    function() {

        document.getElementById("status").innerText =
            "Ready. Press Start Voice Assistant.";

    }
);

</script>
